<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAN Control</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6a737d;--bd:#e1e4e8;--ok:#1a7f37;--bad:#b42318;--ac:#0b5fff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--tx:#e6e9ee;--mut:#8b95a1;--bd:#2a3039;--ok:#3fb950;--bad:#f85149;--ac:#5b9bff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:18px;margin:0}.mut{color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap}
input,button{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;overflow-x:auto;margin-bottom:16px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px}tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--mut)}
.on .dot{background:var(--ok)}.blk{color:var(--bad)}
.acts{display:flex;gap:4px}.acts button{padding:3px 8px;font-size:12px}
h2{font-size:14px;margin:0 0 6px}#msg{min-height:20px;margin-bottom:8px}.err{color:var(--bad)}
</style></head><body><main>
<header><div><h1>LAN Control</h1><div class="mut" id="meta">Loading…</div></div>
<div class="bar"><input id="tok" type="password" placeholder="Control token (from console)" size="24">
<button id="net" title="Change the network to scan">Network: …</button>
<button class="p" id="scan">Scan now</button></div></header>
<div id="msg"></div>
<div class="card"><table><thead><tr><th>Status</th><th>Name</th><th>IP</th><th>MAC</th><th>Hostname</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
<h2>Recent activity</h2><div class="card"><table><tbody id="ev"></tbody></table></div>
</main>
<script>
const $=id=>document.getElementById(id);
const tok=$('tok');try{tok.value=localStorage.getItem('tok')||''}catch(e){}
tok.onchange=()=>{try{localStorage.setItem('tok',tok.value)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=null;
function say(t,bad){$('msg').innerHTML=`<span class="${bad?'err':''}">${esc(t)}</span>`}
async function post(path,body,ok){
  const r=await fetch(path,{method:'POST',headers:{'X-Token':tok.value,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const j=await r.json();
  if(!r.ok)say(j.error||r.statusText,true);else{say(ok||'Done');refresh()}
}
async function refresh(){
  data=await (await fetch('/api/state')).json();render()
}
function render(){
  const s=data.scan;
  $('net').textContent='Network: '+(data.network_override||(s&&s.network)||'auto')+(data.network_override?'':' (auto)')+' ✎';
  $('net').disabled=false;
  if(!s){$('meta').textContent=data.scanning?'Scanning…':'No scan yet';return}
  const on=s.devices.filter(d=>d.online).length;
  $('meta').textContent=`${s.network} · ${on} online / ${s.devices.length} seen · router backend: ${data.router} · ${new Date(s.scanned_at*1000).toLocaleTimeString()}${data.scanning?' · scanning…':''}`;
  $('rows').innerHTML=s.devices.map((d,i)=>`<tr class="${d.online?'on':''}">
   <td><span class="dot"></span>${d.online?'Online':'Offline'}${d.blocked?' <span class="blk">· blocked</span>':''}</td>
   <td>${esc(d.label||'')}${d.is_self?' <span class="mut">(this PC)</span>':''}${d.is_gateway?' <span class="mut">(gateway)</span>':''}</td>
   <td>${d.ip}</td><td>${d.mac||'—'}</td><td>${esc(d.hostname||'—')}</td>
   <td class="acts"><button data-a="label" data-i="${i}">Rename</button>
   ${d.mac?`<button data-a="wake" data-i="${i}">Wake</button>`:''}
   ${d.mac&&!d.is_self&&!d.is_gateway?(d.blocked?`<button data-a="unblock" data-i="${i}">Unblock</button>`:`<button data-a="block" data-i="${i}">Block</button>`):''}
   ${d.mac&&!d.is_self&&!d.is_gateway?`<button data-a="limit" data-i="${i}">${d.limit?`Limit: ${d.limit} kbps`:'Limit'}</button>`:''}
   ${!d.is_self?`<button data-a="power" data-i="${i}">Power…</button>`:''}</td></tr>`).join('');
  $('ev').innerHTML=data.events.slice(0,15).map(e=>`<tr><td class="mut">${new Date(e.t*1000).toLocaleString()}</td><td>${esc(e.name||e.ip)}</td><td>${e.ip}</td><td>${e.what}</td></tr>`).join('')||'<tr><td class="mut">No changes yet</td></tr>';
}
$('rows').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=data.scan.devices[b.dataset.i],k=d.mac||d.ip;
  switch(b.dataset.a){
   case 'label':{const v=prompt('Name for this device',d.label||d.hostname);if(v!==null)post('/api/label',{key:k,label:v});break}
   case 'wake':post('/api/wake',{mac:d.mac},'Wake packet sent');break;
   case 'block':if(confirm(`Block ${d.label||d.ip} at the router?`))post('/api/block',{mac:d.mac},'Blocked');break;
   case 'unblock':post('/api/unblock',{mac:d.mac},'Unblocked');break;
   case 'limit':{const v=prompt(`Max speed for ${d.label||d.ip} in kbps (e.g. 5000 = 5 Mbit/s). 0 removes the limit.`,d.limit||5000);
     if(v!==null&&/^\d+$/.test(v.trim()))post('/api/limit',{mac:d.mac,ip:d.ip,kbps:+v},+v?'Limit applied':'Limit removed');break}
   case 'power':{const a=prompt('Action for '+d.ip+': shutdown, restart or abort (30s delay)','shutdown');
     if(a&&confirm(`${a} ${d.ip}?`))post('/api/power',{host:d.ip,action:a},'Command sent');break}
  }
};
$('net').onclick=()=>{
  const v=prompt('Network to scan, e.g. 192.168.34.0/24 (leave empty to auto-detect)',data.network_override||(data.scan&&data.scan.network)||'');
  if(v!==null)post('/api/network',{network:v},'Scanning '+(v.trim()||'auto-detected network'));
};
$('scan').onclick=()=>post('/api/scan',{},'Scan started');
refresh();setInterval(refresh,5000);
</script></body></html>
